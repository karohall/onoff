<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;}
canvas{display:block;width:100%;height:100%;cursor:crosshair;filter:blur(18px);}
#grain{position:fixed;inset:0;pointer-events:none;}
</style></head>
<body><canvas id="c"></canvas><div id="grain"></div>
<script>
// ---- settings you can change ----
const BG = '';            // '' = transparent, or a colour like '#e3e2ef'
const GRAIN = 0.04;       // film grain (0 = none)
const SPEED = 0.15;       // breathing speed (0 = still until touched)
const FOLLOW = 0.012;     // how softly the shapes follow the hand
const STRENGTH = 0.6;     // colour strength (lower = sheerer)
const SIZE = 1;           // overall size of the shapes
const COLORS = [[159,168,240],[230,240,190],[169,216,255],[247,190,225],[255,255,255]];
const BLOBS = 4;          // number of soft spots
const SPREAD = 0.28;      // minimum distance between shapes (higher = more scattered)
// ---------------------------------

const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;function size(){W=c.width=c.clientWidth;H=c.height=c.clientHeight;}
size();addEventListener('resize',size);

const g=document.createElement('canvas');g.width=g.height=128;
const gx=g.getContext('2d'),gd=gx.createImageData(128,128);
for(let i=0;i<gd.data.length;i+=4){const v=Math.random()*255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255;}
gx.putImageData(gd,0,0);const gr=document.getElementById('grain');gr.style.backgroundImage=`url(${g.toDataURL()})`;gr.style.opacity=GRAIN;

const R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
// scatter anchor points across the whole surface, keeping some distance between them
const anchors=[];
for(let tries=0;anchors.length<BLOBS+1&&tries<2000;tries++){
  const a=[.12+R()*.76,.15+R()*.7];
  if(anchors.every(b=>Math.hypot(a[0]-b[0],a[1]-b[1])>SPREAD))anchors.push(a);
}
while(anchors.length<BLOBS+1)anchors.push([.12+R()*.76,.15+R()*.7]);
// soft, uneven spots, each in its own place
const blobs=[...Array(BLOBS)].map((_,i)=>({c:pick(COLORS),ax:anchors[i+1][0],ay:anchors[i+1][1],
  r:.07+R()*.09,asp:.6+R()*.6,rot:R()*3.14,f:.4+R()*.8,ph:R()*10,dx:0,dy:0}));
// one luminous sliver, like light caught in a fold
const sliver={ax:anchors[0][0],ay:anchors[0][1],w:.22+R()*.08,h:.06+R()*.03,rot:-.35+R()*.3,ph:R()*10};
const sc=document.createElement('canvas'),sx=sc.getContext('2d');

const m={x:0,y:0,on:false,glow:0};
function move(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  m.x=(t.clientX-r.left)*W/r.width;m.y=(t.clientY-r.top)*H/r.height;m.on=true;}
c.addEventListener('mousemove',move);c.addEventListener('touchmove',move,{passive:true});
c.addEventListener('mouseleave',()=>m.on=false);c.addEventListener('touchend',()=>m.on=false);
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

function pull(o,px,py,S){ // gentle drift toward the hand
  const tx=m.on?m.x-px:0,ty=m.on?m.y-py:0,d=Math.hypot(tx,ty)||1,k=m.on?Math.max(0,1-d/(S*.8))*.4:0;
  o.dx+=(tx*k-o.dx)*FOLLOW;o.dy+=(ty*k-o.dy)*FOLLOW;return [px+o.dx,py+o.dy];
}

let t=0;sliver.dx=0;sliver.dy=0;
function frame(){
  t+=0.003*SPEED;
  if(BG){x.fillStyle=BG;x.fillRect(0,0,W,H);}else x.clearRect(0,0,W,H);
  m.glow=m.on?Math.min(1,m.glow+0.015):m.glow*0.992;
  const S=Math.min(W,H)*SIZE;

  for(const b of blobs){
    const [px,py]=pull(b,W*b.ax+S*.03*Math.sin(t*b.f*6+b.ph),H*b.ay+S*.03*Math.cos(t*b.f*5+b.ph),S);
    const r=S*b.r*(1+.08*Math.sin(t*b.f*4+b.ph));
    x.save();x.translate(px,py);x.rotate(b.rot);x.scale(1,b.asp);
    const rg=x.createRadialGradient(0,0,0,0,0,r);
    rg.addColorStop(0,rgba(b.c,STRENGTH));rg.addColorStop(.5,rgba(b.c,STRENGTH*.5));rg.addColorStop(1,rgba(b.c,0));
    x.fillStyle=rg;x.beginPath();x.arc(0,0,r,0,6.283);x.fill();x.restore();
  }

  // sliver: an ellipse with a softer ellipse carved out above it = a crescent of light
  const sw=S*sliver.w, sh=S*sliver.h*(1+.1*Math.sin(t*3+sliver.ph));
  sc.width=Math.ceil(sw*2.4);sc.height=Math.ceil(sw*1.2);
  const ccx=sc.width/2,ccy=sc.height/2;
  sx.clearRect(0,0,sc.width,sc.height);
  const lg=sx.createLinearGradient(ccx-sw,0,ccx+sw,0);
  lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.35,`rgba(220,235,255,${.75+m.glow*.25})`);
  lg.addColorStop(.6,`rgba(255,255,255,${.9+m.glow*.1})`);lg.addColorStop(.85,'rgba(250,215,240,.5)');lg.addColorStop(1,'rgba(255,255,255,0)');
  sx.fillStyle=lg;sx.beginPath();sx.ellipse(ccx,ccy,sw,sh*2.2,0,0,6.283);sx.fill();
  sx.globalCompositeOperation='destination-out';
  sx.beginPath();sx.ellipse(ccx+sw*.08,ccy-sh*1.1,sw*1.05,sh*2.2,0,0,6.283);sx.fill();
  sx.globalCompositeOperation='source-over';
  const [spx,spy]=pull(sliver,W*sliver.ax,H*sliver.ay,S);
  x.save();x.translate(spx,spy);x.rotate(sliver.rot+.05*Math.sin(t*2+sliver.ph));
  x.drawImage(sc,-ccx,-ccy);x.restore();

  if(m.glow>0.01){ // a faint warmth where the hand is
    const r=S*.18,rg=x.createRadialGradient(m.x,m.y,0,m.x,m.y,r);
    rg.addColorStop(0,`rgba(255,255,255,${.3*m.glow})`);rg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=rg;x.beginPath();x.arc(m.x,m.y,r,0,6.283);x.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
