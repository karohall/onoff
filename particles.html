<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;}
canvas{display:block;width:100%;height:100%;filter:blur(22px);transform:scale(1.1);}
#grain{position:fixed;inset:0;pointer-events:none;}
</style></head>
<body><canvas id="c"></canvas><div id="grain"></div>
<script>
// ---- settings you can change ----
const BG = '';               // '' = transparent, or a colour like '#e3e2ef'
const GRAIN = 0.05;          // film grain strength (0 = none)
const SPEED = 1;             // drift speed
const SHEATHS = [            // [start colour, end colour] per veil
  [[247,168,216],[169,216,255]],  // pearl pink -> ice blue
  [[247,233,138],[159,168,240]],  // soft yellow -> periwinkle
  [[169,216,255],[255,255,255]]   // ice blue -> light
];
// ---------------------------------

const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;
function size(){W=c.width=c.clientWidth;H=c.height=c.clientHeight;}
size();addEventListener('resize',size);

// film grain
const g=document.createElement('canvas');g.width=g.height=128;
const gx=g.getContext('2d'),gd=gx.createImageData(128,128);
for(let i=0;i<gd.data.length;i+=4){const v=Math.random()*255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255;}
gx.putImageData(gd,0,0);
const gr=document.getElementById('grain');gr.style.backgroundImage=`url(${g.toDataURL()})`;gr.style.opacity=GRAIN;

// each sheath: 4 control points that breathe slowly
const veils=SHEATHS.map((cols,i)=>({cols,ph:Math.random()*10+i*2.1,
  pts:[0,1,2,3].map(k=>({bx:.1+.27*k+(Math.random()-.5)*.1,by:.25+Math.random()*.5,
    ax:.06+Math.random()*.08,ay:.12+Math.random()*.12,f:.5+Math.random()*.7,dx:0,dy:0}))}));

const m={x:0,y:0,on:false,glow:0};
function move(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  m.x=(t.clientX-r.left)*W/r.width;m.y=(t.clientY-r.top)*H/r.height;m.on=true;}
c.addEventListener('mousemove',move);c.addEventListener('touchmove',move,{passive:true});
c.addEventListener('mouseleave',()=>m.on=false);c.addEventListener('touchend',()=>m.on=false);

function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
let t=0;
function frame(){
  t+=0.003*SPEED;
  if(BG){x.fillStyle=BG;x.fillRect(0,0,W,H);}else x.clearRect(0,0,W,H);
  m.glow=m.on?Math.min(1,m.glow+0.03):m.glow*0.985;   // touch lingers, then fades
  const S=Math.min(W,H);
  for(const v of veils){
    const P=v.pts.map(p=>{
      let px=W*(p.bx+p.ax*Math.sin(t*p.f*6+v.ph)), py=H*(p.by+p.ay*Math.cos(t*p.f*5+v.ph*1.3));
      // touch bends the fabric toward the hand
      const tx=m.on?(m.x-px):0, ty=m.on?(m.y-py):0, d=Math.hypot(tx,ty)||1, k=m.on?Math.max(0,1-d/(S*.6))*.35:0;
      p.dx+=(tx*k-p.dx)*0.04; p.dy+=(ty*k-p.dy)*0.04;
      return [px+p.dx,py+p.dy];
    });
    const grad=x.createLinearGradient(P[0][0],P[0][1],P[3][0],P[3][1]);
    grad.addColorStop(0,rgba(v.cols[0],0));grad.addColorStop(.25,rgba(v.cols[0],.55));
    grad.addColorStop(.75,rgba(v.cols[1],.55));grad.addColorStop(1,rgba(v.cols[1],0));
    x.lineCap='round';
    // the broad veil
    x.strokeStyle=grad;x.lineWidth=S*(.16+.04*Math.sin(t*4+v.ph));
    x.beginPath();x.moveTo(...P[0]);x.bezierCurveTo(...P[1],...P[2],...P[3]);x.stroke();
    // a thin sheen along the fold
    x.strokeStyle=rgba([255,255,255],.35+m.glow*.3);x.lineWidth=S*.025;
    x.beginPath();x.moveTo(P[0][0],P[0][1]-S*.03);x.bezierCurveTo(P[1][0],P[1][1]-S*.03,P[2][0],P[2][1]-S*.03,P[3][0],P[3][1]-S*.03);x.stroke();
  }
  if(m.glow>0.01){ // soft light where the hand is
    const r=S*.25,rg=x.createRadialGradient(m.x,m.y,0,m.x,m.y,r);
    rg.addColorStop(0,`rgba(255,255,255,${.5*m.glow})`);rg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=rg;x.beginPath();x.arc(m.x,m.y,r,0,6.283);x.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
