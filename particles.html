<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e3e2ef;}
canvas{display:block;width:100%;height:100%;cursor:crosshair;filter:blur(16px);transform:scale(1.08);}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.06;}
</style></head>
<body><canvas id="c"></canvas><div id="grain"></div>
<script>
// ---- settings you can change ----
const BG = '#e3e2ef';        // background (soft lavender grey)
const SCALE = 3;             // resolution divider
const FADE = 0.018;          // how fast trails fade (higher = shorter)
const GRAIN = 0.06;          // film grain strength
const COLORS = [             // iridescent palette
  [247,168,216], // pearl pink
  [247,233,138], // soft yellow
  [169,216,255], // ice blue
  [159,168,240], // periwinkle
  [255,255,255]  // light
];
// ---------------------------------

const c=document.getElementById('c'),ctx=c.getContext('2d');
const b=document.createElement('canvas'),bx=b.getContext('2d');
let W,H,BW,BH;
function hex(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16));}
const bg=hex(BG);
function size(){
  W=c.clientWidth;H=c.clientHeight;c.width=W;c.height=H;
  BW=Math.max(40,Math.round(W/SCALE));BH=Math.max(40,Math.round(H/SCALE));
  b.width=BW;b.height=BH;bx.fillStyle=BG;bx.fillRect(0,0,BW,BH);
}
size();addEventListener('resize',size);

// film grain tile
const g=document.createElement('canvas');g.width=g.height=128;
const gx=g.getContext('2d'),gd=gx.createImageData(128,128);
for(let i=0;i<gd.data.length;i+=4){const v=Math.random()*255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255;}
gx.putImageData(gd,0,0);const gd2=document.getElementById('grain');gd2.style.backgroundImage=`url(${g.toDataURL()})`;gd2.style.opacity=GRAIN;

// slow drifting "ribbons"
const walkers=[];
for(let i=0;i<3;i++)walkers.push({
  p:Math.random()*100, f1:.13+Math.random()*.1, f2:.09+Math.random()*.1,
  ax:.3+Math.random()*.15, ay:.28+Math.random()*.15, col:COLORS[i%COLORS.length]});

function blob(x,y,r,col,a){
  const gr=bx.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${a})`);
  gr.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
  bx.fillStyle=gr;bx.beginPath();bx.arc(x,y,r,0,6.283);bx.fill();
}
function mix(t){const n=COLORS.length,s=((t%n)+n)%n,i=Math.floor(s),f=s-i,a=COLORS[i],q=COLORS[(i+1)%n];
  return a.map((v,k)=>Math.round(v+(q[k]-v)*f));}

// touch
const m={x:0,y:0,px:0,py:0,on:false};
function move(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  m.px=m.on?m.x:t.clientX-r.left;m.py=m.on?m.y:t.clientY-r.top;
  m.x=t.clientX-r.left;m.y=t.clientY-r.top;m.on=true;}
c.addEventListener('mousemove',move);c.addEventListener('touchmove',move,{passive:true});
c.addEventListener('mouseleave',()=>m.on=false);c.addEventListener('touchend',()=>m.on=false);

let t=0;
function frame(){
  t+=0.004;
  // slow fade back to background: traces linger, then dissolve
  bx.fillStyle=`rgba(${bg[0]},${bg[1]},${bg[2]},${FADE})`;bx.fillRect(0,0,BW,BH);
  for(const w of walkers){
    const x=BW*(.5+w.ax*Math.sin(t*w.f1*10+w.p)+.08*Math.sin(t*w.f2*23+w.p*2));
    const y=BH*(.5+w.ay*Math.cos(t*w.f2*10+w.p)+.08*Math.cos(t*w.f1*19+w.p));
    blob(x,y,Math.min(BW,BH)*.07,mix(t*3+w.p),.13);
  }
  if(m.on){ // the hand leaves a luminous trace
    const steps=6;
    for(let i=0;i<=steps;i++){
      const x=(m.px+(m.x-m.px)*i/steps)/SCALE,y=(m.py+(m.y-m.py)*i/steps)/SCALE;
      blob(x,y,Math.min(BW,BH)*.06,mix(t*6),.12);
    }
    m.px=m.x;m.py=m.y;
  }
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(b,0,0,W,H);
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
