<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;}
canvas{display:block;width:100%;height:100%;filter:blur(28px);}
#grain{position:fixed;inset:0;pointer-events:none;}
</style></head>
<body><canvas id="c"></canvas><div id="grain"></div>
<script>
// ---- settings you can change ----
const STRENGTH = 0.5;     // how visible a bloom gets at its strongest (lower = fainter)
const LIFE = 12;          // seconds from first touch of water to gone
const SIZE = 0.5;        // how far a bloom spreads (fraction of the surface)
const MAXDROPS = 5;       // blooms alive at the same time
const EVERY = [3, 7];     // seconds between new blooms (min, max)
const COLORS = [[110,220,232],[169,216,255],[90,140,255],[159,168,240],[216,208,250],[247,168,216]];
const GRAIN = 0.035;      // fine grain, softens banding (0 = none)
// ---------------------------------

const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;function size(){W=c.width=c.clientWidth;H=c.height=c.clientHeight;}
size();addEventListener('resize',size);
const R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
const g=document.createElement('canvas');g.width=g.height=128;
const gx=g.getContext('2d'),gd=gx.createImageData(128,128);
for(let i=0;i<gd.data.length;i+=4){const v=R()*255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255;}
gx.putImageData(gd,0,0);const gr=document.getElementById('grain');gr.style.backgroundImage=`url(${g.toDataURL()})`;gr.style.opacity=GRAIN;
const drops=[];

function drop(px,py,touched){
  if(drops.length>=MAXDROPS+(touched?2:0))return;
  drops.push({x:px,y:py,born:performance.now()/1000,
    life:LIFE*(.7+R()*.6),size:SIZE*(.6+R()*.6)*(touched?.7:1),
    c1:pick(COLORS),c2:pick(COLORS),
    // a few random waves give each bloom its own uneven outline
    waves:[...Array(5)].map((_,k)=>({n:2+k,a:.05+R()*.12,ph:R()*6.28,sp:(R()-.5)*.3})),
    vx:(R()-.5)*.0006,vy:(R()-.5)*.0006});
}
function schedule(){drop(W*(.1+R()*.8),H*(.1+R()*.8));setTimeout(schedule,1000*(EVERY[0]+R()*(EVERY[1]-EVERY[0])));}
schedule();

// a touch is a drop of water meeting the paper
let last=0;
function touch(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e,now=performance.now();
  if(now-last<1400)return;last=now;
  drop((t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height,true);}
c.addEventListener('mousemove',touch);c.addEventListener('touchstart',touch,{passive:true});
c.addEventListener('click',touch);

const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function frame(){
  const now=performance.now()/1000,S=Math.min(W,H);
  x.clearRect(0,0,W,H);
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i],u=(now-d.born)/d.life;
    if(u>=1){drops.splice(i,1);continue;}
    const spread=1-Math.pow(1-u,3);                 // spreads fast, then slows, like water in paper
    const alpha=STRENGTH*Math.sin(Math.PI*Math.min(1,u*1.4))*(1-u); // blooms, then fades away
    const r=S*d.size*(.15+.85*spread);
    d.x+=d.vx*S;d.y+=d.vy*S;
    // organic outline
    x.beginPath();
    for(let k=0;k<=64;k++){
      const th=k/64*6.283;let f=1;
      for(const w of d.waves)f+=w.a*Math.sin(w.n*th+w.ph+now*w.sp);
      const px=d.x+Math.cos(th)*r*f,py=d.y+Math.sin(th)*r*f*.85;
      k?x.lineTo(px,py):x.moveTo(px,py);
    }
    const g=x.createRadialGradient(d.x,d.y,0,d.x,d.y,r*1.2);
    g.addColorStop(0,rgba(d.c1,alpha));g.addColorStop(.55,rgba(d.c2,alpha*.7));g.addColorStop(1,rgba(d.c2,0));
    x.fillStyle=g;x.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
